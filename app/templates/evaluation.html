{% extends "workspace.html" %}
{% block title %}Evaluation · CMF{% endblock %}
{% block main %}
<header class="workspace-header header-row">
    <h2>Evaluation</h2>
    <div class="header-actions">
        <button type="button" class="btn-secondary small-btn" hx-get="/evaluation/body" hx-include="#eval-category-filter" hx-target="#evaluation-body">Refresh</button>
        <button type="button" class="btn-primary small-btn" hx-post="/evaluation/run" hx-target="#evaluation-body" hx-disabled-elt="this">Run</button>
    </div>
</header>
<div class="dashboard-body" id="evaluation-body">
    {% include "partials/evaluation_body.html" %}
</div>
{% endblock %}
